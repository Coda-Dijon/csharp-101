# Publie les slides de toutes les séances sur GitHub Pages, avec une page d'accueil pour choisir la séance.
# Prérequis (une fois) : Settings › Pages › Build and deployment › Source = "GitHub Actions".
name: Déployer les slides

on:
  push:
    branches: [main]
    paths:
      - 'slides/**'
      - '.github/workflows/deploy-slides.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slides/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        env:
          # Chromium ne sert qu'à l'export PDF/PNG, inutile pour le site
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Construire le site
        run: npm run build:site
        env:
          BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: slides/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
